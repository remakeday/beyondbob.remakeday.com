---
layout: default
---
<div class="container">
  <header class="page-head">
    <div class="page-head__eyebrow">데브로그</div>
    <h1>{{ page.title }}</h1>
    <p>
      {{ page.date | date: "%Y-%m-%d" }}
      {%- if page.author %}
        {%- assign _a = site.data.team | where: "key", page.author | first %} ·
        <span class="pill"><span class="avatar avatar--sm" style="background:{{ _a.color }}">{{ _a.initial }}</span> {{ _a.name }} · {{ _a.role }}</span>
      {%- endif %}
    </p>
  </header>
  <div class="content">{{ content }}</div>
</div>
