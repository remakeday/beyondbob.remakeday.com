  name:     "김충식"
  role:     "Scenario Director · Content"
  prefix:   "SC"
  color:    "#eb5757"
  initial:  "충"
  scope:    >-
    REMAKE DAY가 살아가는 세계를 쓴다. 시나리오 A(구역)의 인물·비트·공개 관찰·진실 명제·쿠키
    콘텐츠 데이터와 장면·인물·쿠키 그림·스타일 가이드를 만든다. 사운드도 소유한다 — 배경 BGM과
