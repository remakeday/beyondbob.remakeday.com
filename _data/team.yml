# 팀 프로필 — com.remakeday/docs/teamprofile.md v3.1 기준 (2026-09-14)
# 역할 구조 원본: Masterless_Company_Team_Roles_v1.1 — 동일 팀·동일 분담을 REMAKE DAY에 맞게 번역
- key:      ryujun
  name:     "류준"
  role:     "Team Lead · AI Agent Engineer"
  prefix:   "TL"
  color:    "#f2c94c"
  initial:  "류"
  scope:    >-
    팀장으로서 스코프와 기술 결정을 최종 확정한다. 백엔드 계층 구조(모듈러 모놀리스·헥사고날·
    Fractal 11-File Set)와 Port/Adapter 경계를 설계하고 프론트–백엔드 API 계약을 소유한다.
    LLM이 말하는 7개 자리의 프롬프트·구조화 출력 스키마·시스템 하네스를 구현하고, 모델이
    실패해도 게임이 무너지지 않도록 재생성과 폴백 경로를 책임진다. 발표를 맡는다.
  owns:
    - "소프트웨어 아키텍처 · API 계약"
    - "Agent Harness (재생성 · 폴백 · 사실 층 검사)"
    - "LLM 역할 프롬프트 · 구조화 출력 · 7세 정책"
    - "시나리오 교체 가능성 (BaseScenario 계약)"
    - "스코프 확정 · 발표"

- key:      minseok
  name:     "장민석"
  role:     "AI Evaluation Engineer"
  prefix:   "EVAL"
  color:    "#56ccf2"
  initial:  "민"
  scope:    >-
    "이 슬롯에 어떤 모델을 쓸 것인가"라는 질문을 측정 가능한 실험으로 설계하고 실행한다.
    평가 러너·프로브 코퍼스·게이트를 소유하고, Core 슬롯 선정(E7)과 NPC 슬롯 descent(E6)에
    숫자를 붙인다. 하네스 계측(HarnessReport)을 집계하고, provider 어댑터와 판단 근거를
    시각화하는 Inspector·Harness 뷰를 만든다. 발표의 모델 평가 구간을 맡는다.
  owns:
    - "평가 설계 (E7 · E6 · Funnel · 게이트)"
    - "하네스 계측 집계 (HarnessReport)"
    - "평가 러너 · metrics.yml (append-only)"
    - "provider 어댑터 · 배포 지표 (지연 · VRAM)"
    - "Inspector / Harness 뷰 · 발표 모델 평가 구간"

- key:      chaeyeon
  name:     "신채연"
  role:     "Full-stack Engineer · Game Frontend"
  prefix:   "FS"
  color:    "#bb6bd9"
  initial:  "채"
  scope:    >-
    세계가 굴러가는 규칙을 결정론 코드로 구현한다. 하루 6비트 낮 루프, 밤의 노트·주장·채점,
    신의 개입(질문·규칙·원숭이손), 회차 간 세계 손상과 쿠키를 만들고 Game API와 PostgreSQL
    스키마를 소유한다. LLM이 폴백이어도 규칙은 반드시 걸리도록 기계 보정 경로를 유지한다.
    Next.js /play 게임 화면을 연결·구현하고 프로덕션 빌드·기동을 주도한다. 시연 조작을 맡는다.
  owns:
    - "게임 엔진 (낮 루프 · 밤 채점 · 신의 개입)"
    - "Game API · DB (PostgreSQL · alembic)"
    - "/play 게임 화면 (Next.js)"
    - "프론트 프로덕션 빌드 · 기동"
    - "시연 조작"

- key:      eunsang
  name:     "이은상"
  role:     "QA · UI Support · Release Engineer"
  prefix:   "QA"
  color:    "#6fcf97"
