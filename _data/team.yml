  scope:    >-
    규칙·재현성·화면을 검증하고 결함을 기록한다. 뷰포트 자동 검사와 플레이 검증으로 제출 가능
    상태를 보증하고, 보조 화면과 그림·사운드 반입을 지원한다. 통합 리허설과 백엔드/프론트
    외부망 검증, 기동 스크립트를 책임진다. Jekyll 허브와 게임 런타임의 링크·뷰포트·정적 파일
    경로도 검증한다.
  owns:
    - "게임 QA (백엔드 회귀 스위트 · 채점 재현성)"
    - "자동 검사 (frontend/tests · 390px · 1440px)"
    - "플레이 검증 · 결함 로그"
    - "보조 화면 · 그림/사운드 반입 검증"
    - "기동 스크립트 · 외부망 검증 · 통합 리허설"

